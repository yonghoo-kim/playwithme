<div style="margin:0;padding:24px 12px;background:#e3f6ff;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
  <div style="max-width:420px;margin:0 auto;background:#ffffff;border:4px solid #1f2937;border-radius:20px;padding:28px 24px;text-align:center;">
    <h1 style="margin:0 0 8px;font-size:26px;color:#be185d;">나랑 놀자 🎈</h1>
    <p style="margin:0 0 20px;font-size:15px;color:#1e3a8a;font-weight:bold;">비밀번호를 다시 설정해 주세요</p>

    <p style="margin:0 0 20px;font-size:14px;line-height:1.7;color:#374151;">
      아래 버튼을 누르면 새 비밀번호를 정할 수 있어요.<br />
      링크는 <b>1시간 동안</b>, <b>한 번만</b> 쓸 수 있어요.
    </p>

    <a href="{{ .SiteURL }}/reset-password?token_hash={{ .TokenHash }}&type=recovery"
       style="display:inline-block;padding:12px 28px;background:#93c5fd;color:#1e3a8a;border:4px solid #1f2937;border-radius:16px;font-size:16px;font-weight:bold;text-decoration:none;">

      <span style="word-break:break-all;color:#1e3a8a;">{{ .SiteURL }}/reset-password?token_hash={{ .TokenHash }}&type=recovery</span>
    </p>

    <p style="margin:20px 0 0;font-size:12px;line-height:1.7;color:#6b7280;">
      비밀번호 재설정을 요청하지 않았다면 이 메일은 무시해 주세요.<br />
      비밀번호는 바뀌지 않아요.
    </p>
  </div>
  <p style="max-width:420px;margin:12px auto 0;font-size:11px;color:#6b7280;text-align:center;">
